name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag to attach assets to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  package-plugin:
    name: Validate and Package Obsidian Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate plugin syntax
        run: node -c main.js

      - name: Package Obsidian plugin archive
        id: pkg
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
          ARCHIVE="tether-obsidian-${TAG}.zip"
          mkdir -p dist/tether
          cp manifest.json main.js styles.css versions.json LICENSE README.md dist/tether/
          (cd dist && zip -r "../${ARCHIVE}" tether)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          files: |
            manifest.json
            main.js
            styles.css
            versions.json
            ${{ steps.pkg.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
