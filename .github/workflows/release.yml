name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag to attach assets to (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-plugin:
    name: Validate, Attest, and Release Obsidian Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate plugin syntax
        run: node -c main.js

      - name: Determine release tag
        id: pkg
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true
          files: |
            manifest.json
            main.js
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
